name: Trainer Shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        runs-on: windows-latest
        steps:
            # Checkout the repository
            - name: Checkout repository
              uses: actions/checkout@v3

            # Set up .NET SDK
            - name: Restore NuGet packages
              run: nuget restore ./ede-demo-blazor.slnx

            # Build the solution
            - name: Build solution
              run: dotnet build ./ede-demo-blazor.slnx --configuration Release