name: MMayes Shell

on:
  pull_request:
    branches: [ main ]

permissions:
    contents: read

jobs:
    build:
        runs-on: windows-latest
        steps:
            # Download Source Code
            - name: Checkout repository
              uses: actions/checkout@v3

            # Restore Nuget Packages
            - name: Restore NuGet packages
              run: nuget restore ./ede-demo-blazor.slnx

            # Compile Solution
            - name: Build Solution
              run: dotnet build ./ede-demo-blazor.slnx --configuration Release