name: Jobro Shell

on:
  pull_request:
    branches: 
      - main
    paths-ignore:
      - '.github/'

permissions:
  contents: read
  
env:
  project_name: "ede-demo-blazor"

jobs:
    build:
        runs-on: windows-latest
        steps:
            # Download Source Code
            - name: Checkout repository
              uses: actions/checkout@v3

            # Restore Nuget Packages
            - name: Restore NuGet packages
              run: nuget restore ./${{env.project_name}}.slnx

            # Compile Solution
            - name: Build Solution
              run: dotnet build ./${{env.project_name}}.slnx --configuration Release
