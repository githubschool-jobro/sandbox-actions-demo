name: Jobro Shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            - name: Restore NuGet packages
              run: nuget restore ./ede-demo-blazor.slnx
            - name: Build Solution
              run: dotnet build ./ede-demo-blazor.slnx --configuration Release