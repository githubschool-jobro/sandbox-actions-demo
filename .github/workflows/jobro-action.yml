name: Jobro Shell

on:
  workflow_dispatch: 

permissions:
  contents: write
  
env:
  project_name: "ede-demo-blazor"

jobs:
    build:
        runs-on: windows-latest
        steps:
            # Download Source Code
            - name: Checkout repository
              uses: actions/checkout@v3

            # Restore Nuget Packages
            - name: Restore NuGet packages
              run: nuget restore ./${{env.project_name}}.slnx

            # Compile Solution
            - name: Build Solution
              run: dotnet build ./${{env.project_name}}.slnx --configuration Release

            # Publish the application
            - name: Publish application
              run: dotnet publish ./${{env.project_name}}/${{env.project_name}}.csproj --configuration Release --output ./publish

            # Compress the published output into a zip file
            - name: Compress artifact
              run: Compress-Archive -Path ./publish/* -DestinationPath ./${{env.project_name}}.zip

            # Create a GitHub Release and upload the artifact
            - name: Create GitHub Release
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release create "v1.0.${{ github.run_number }}" "./${{env.project_name}}.zip" --title "Release v1.0.${{ github.run_number }}" --notes "Automated release from build ${{ github.run_number }}"
